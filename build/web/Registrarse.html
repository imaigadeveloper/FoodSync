    <!-- ICONOS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Pacifico&display=swap" rel="stylesheet">
    <!-- SCRIPT -->
    <script>

        function mostrarPassword(id){

            let input = document.getElementById(id);

            if(input.type === "password"){
                input.type = "text";
            }else{
                input.type = "password";
            }

        }

        document.getElementById("formulario")
        .addEventListener("submit", function(e){

            //e.preventDefault();

            let nombre =
            document.getElementById("nombre").value;

            let correo =
            document.getElementById("correo").value;

            let usuario =
            document.getElementById("usuario").value;

            let password =
            document.getElementById("password").value;

            let confirmar =
            document.getElementById("confirmar").value;

            let mensaje =
            document.getElementById("mensaje");

            if(
                nombre === "" ||
                correo === "" ||
                usuario === "" ||
                password === "" ||
                confirmar === ""
            ){
                e.preventDefault();
                mensaje.innerHTML =
                "Completa todos los campos";

                mensaje.style.color = "orange";

                return;
            }

            if(password.length < 8){
                e.preventDefault();
                mensaje.innerHTML =
                "La contraseña debe tener mínimo 8 caracteres";

                mensaje.style.color = "red";

                return;
            }

            if(password !== confirmar){
                e.preventDefault();
                mensaje.innerHTML =
                "Las contraseñas no coinciden";

                mensaje.style.color = "red";

                return;
            }

            mensaje.innerHTML =
            "Cuenta creada correctamente";

            mensaje.style.color = "lime";

            setTimeout(function(){

                window.location.href =
                "principal.html";

            },1000);

        });

    </script>

</head>

    <!-- SECCION -->
    <section class="registro-section">

        <h1 class="titulo-registro">
            Regístrate
        </h1>

        <!-- CARD -->
        <div class="registro-card">

            <div class="formulario-box">

                <form id="formulario" method="post" action="guardarUsuario.jsp">

                    <!-- FECHA -->
                    <label>
                        Fecha de nacimiento
                    </label>

                    <div class="fecha-container">
                        
                        <input type="date"
                            id="fecha"
                            name="fecha">

                    </div>

                    <!-- NOMBRE -->
                    <label>
                        Nombre completo
                    </label>

                    <div class="input-box">

                        <input type="text"
                               id="nombre"
                               name="nombre"
                               placeholder="Ingresa tu nombre">

                    </div>

                    <!-- CORREO -->
                    <label>
                        Correo electrónico
                    </label>

                    <div class="input-box">

                        <input type="email"
                               id="correo"
                               name="correo"
                               placeholder="Ingresa tu correo">

                    </div>

                    <!-- USER -->
                    <label>
                        Crea un usuario
                    </label>

                    <div class="input-box">

                        <input type="text"
                               id="usuario"
                               name="usuario"
                               placeholder="Nombre de usuario">

                    </div>

                    <!-- PASSWORD -->
                    <label>
                        Contraseña
                    </label>

                    <div class="input-box">

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Por lo menos 8 caracteres">

                        <span class="ojo"
                              onclick="mostrarPassword('password')">

                              <i class="fa-solid fa-eye"></i>

                        </span>

                    </div>

                    <!-- CONFIRMAR -->
                    <label>
                        Confirmar contraseña
                    </label>

                    <div class="input-box">

                        <input type="password"
                               id="confirmar"
                               placeholder="Confirma tu contraseña">

                        <span class="ojo"
                              onclick="mostrarPassword('confirmar')">

                              <i class="fa-solid fa-eye"></i>

                        </span>

                    </div>

                    <!-- BOTON -->
                    <button type="submit"
                            class="btn-registrar">

                        Registrar

                    </button>

                    <!-- MENSAJE -->
                    <div class="mensaje"
                         id="mensaje">

                    </div>

                </form>

            </div>

        </div>

    </section>
