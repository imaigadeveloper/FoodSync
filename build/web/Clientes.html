<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>

    <link rel="stylesheet" href="Clientes.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>

        function mostrarPassword(){

            let input =
                document.getElementById("password");

            if(input.type==="password"){

                input.type="text";

            }else{

                input.type="password";
            }
        }

    </script>
</head>

<body>

<div class="contenedor-sitio">

    <!-- NAVBAR -->

    <nav class="navbar-top">

        <div class="logo-box">
            <img src="imagen/Logo.png"
                 alt="FoodSync"
                 class="nav-logo">
        </div>

    </nav>

    <!-- MENU -->

    <div class="menu-nav">

        <a href="Inicio.html">Inicio</a>
        <span>|</span>

        <a href="Platillos.jsp">Platillos</a>
        <span>|</span>

        <a href="Mesas.jsp">Mesas</a>
        <span>|</span>

        <a href="Reservaciones.html">Reservaciones</a>
        <span>|</span>

        <a href="Pedidos.html">Pedidos</a>
        <span>|</span>

        <a href="Personal.html">Personal</a>
        <span>|</span>

        <a href="Clientes.html" class="activo">Clientes</a>
        <span>|</span>

        <a href="Ventas.html">Ventas</a>
        <span>|</span>

        <a href="Cocina.html">Cocina</a>

    </div>

    <!-- CONTENIDO -->

    <main class="contenido">

        <section class="panel-principal">

            <div class="administrar-clientes">

                <h1>Administrar clientes</h1>

                <div class="panel-admin">

                    <div class="datos-cliente">

                        <h2>Datos del Cliente</h2>

                        <div class="campo">
                            <label>Nombre:</label>
                            <input type="text">
                        </div>

                        <div class="campo">
                            <label>Teléfono:</label>
                            <input type="text">
                        </div>

                        <div class="campo">
                            <label>Email:</label>
                            <input type="email">
                        </div>

                        <div class="campo">
                            <label>Puntos:</label>
                            <input type="number">
                        </div>

                    </div>

                    <div class="confirmacion">

                        <label>
                            Confirmar modificación
                            <br>
                            con clave de permiso
                        </label>

                        <div class="input-password">

                            <input type="password"
                                   id="password">

                            <i class="fa-solid fa-eye"
                               onclick="mostrarPassword()"></i>

                        </div>

                        <input type="button"
                               value="confirmar"
                               class="confirmar">

                    </div>

                    <div class="crud-botones">

                        <input type="button"
                               value="Eliminar"
                               class="crud-btn">

                        <input type="button"
                               value="Actualizar"
                               class="crud-btn">

                        <input type="button"
                               value="Añadir"
                               class="crud-btn">

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <footer class="pie-morado">

        <div class="footer-box">

            <h4>Horario</h4>

            <p>Lunes - Domingo</p>

            <p>8:00 AM - 11:00 PM</p>

        </div>

        <div class="footer-box">

            <h4>Ubicación</h4>

            <p>Av. FoodSync #128</p>

            <p>Ciudad de México</p>

        </div>

        <div class="footer-box">

            <h4>Síguenos</h4>

            <div class="iconos">

                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-x-twitter"></i>
                <i class="fa-brands fa-youtube"></i>

            </div>

        </div>

    </footer>

    <div class="copy">
        © 2026 FoodSync — Todos los derechos reservados
    </div>

</div>



</body>
</html>
